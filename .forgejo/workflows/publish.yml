name: Check, publish and propose deployment
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
jobs:
  check:
    runs-on: homelab-docker
    container: python:3.12-slim
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cu_clubs:ci-only@127.0.0.1:5432/cu_clubs_test
      # Keep cache and venv on the same workspace volume so wheels are hardlinked.
      UV_CACHE_DIR: .uv-cache
      UV_LINK_MODE: hardlink
    steps:
    - name: Checkout exact source revision without stored credentials
      env:
        CHECKOUT_SHA: ${{ github.sha }}
      run: |
        apt-get update && apt-get install --no-install-recommends -y git ca-certificates
        git init source
        git -C source remote add origin https://git.cu3rd.ru/Jedi_kitten/cu-clubs-bot.git
        git -C source fetch --no-tags --depth 1 origin "$CHECKOUT_SHA"
        git -C source checkout --detach FETCH_HEAD
    - name: Start isolated job-local PostgreSQL
      run: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get install --no-install-recommends -y postgresql postgresql-client
        pg_version=$(pg_lsclusters --no-header | awk '$2 == "main" {print $1}')
        test -n "$pg_version"
        # Bound WAL for this disposable CI cluster; retain normal fsync/durability.
        pg_conftool "$pg_version" main set min_wal_size 32MB
        pg_conftool "$pg_version" main set max_wal_size 64MB
        pg_conftool "$pg_version" main set checkpoint_timeout 30s
        pg_conftool "$pg_version" main set wal_compression on
        pg_ctlcluster "$pg_version" main status >/dev/null 2>&1 || pg_ctlcluster "$pg_version" main start
        pg_isready --host=127.0.0.1 --port=5432
        su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE USER cu_clubs WITH PASSWORD 'ci-only' CREATEDB;\""
        su postgres -c "createdb --owner=cu_clubs cu_clubs_test"
        apt-get clean
        rm -rf /var/lib/apt/lists/*
    - name: Install locked tooling
      run: |
        python -m pip install --no-cache-dir --disable-pip-version-check uv==0.13.7
        cd source
        uv sync --locked
        uv cache clean
    - name: Check source and stop at the first test error
      run: |
        df -h / /workspace /var/lib/postgresql
        cd source
        uv run --frozen ruff check .
        uv run --frozen ruff format --check .
        python scripts/check_api_docs.py
        uv run --frozen pytest -x --tb=short
    - name: Diagnose failed isolated test environment
      if: failure()
      run: |
        df -h / /workspace /var/lib/postgresql
        df -i / /workspace /var/lib/postgresql
        tail -n 30 /var/log/postgresql/postgresql-*-main.log 2>/dev/null || true
    defaults:
      run:
        shell: sh
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: homelab-docker
    container: docker:27-cli
    steps:
    - name: Checkout exact source revision
      env:
        CHECKOUT_SHA: ${{ github.sha }}
      run: |
        apk add --no-cache git ca-certificates
        git init source
        git -C source remote add origin https://git.cu3rd.ru/Jedi_kitten/cu-clubs-bot.git
        git -C source fetch --no-tags --depth 1 origin "$CHECKOUT_SHA"
        git -C source checkout --detach FETCH_HEAD
    - name: Publish self-service image
      env:
        REGISTRY_USER: ${{ vars.REGISTRY_USER || github.repository_owner }}
        REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || github.token }}
        IMAGE_TAG: ${{ github.sha }}
        SOURCE_REPO: ${{ github.repository }}
      run: |
        set -eu
        image="git.cu3rd.ru/$(printf '%s' "$SOURCE_REPO" | tr '[:upper:]' '[:lower:]')"
        export DOCKER_CONFIG
        DOCKER_CONFIG=$(mktemp -d)
        trap 'rm -rf "$DOCKER_CONFIG"' EXIT
        printf '%s' "$REGISTRY_TOKEN" | docker login git.cu3rd.ru --username "$REGISTRY_USER" --password-stdin
        docker build --target selfservice -t "$image:$IMAGE_TAG" source
        docker push "$image:$IMAGE_TAG"
    defaults:
      run:
        shell: sh
  deliver:
    needs: publish
    if: >-
      vars.SELF_SERVICE_DELIVERY_READY == 'true' &&
      github.repository == 'Jedi_kitten/cu-clubs-bot' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: homelab-docker
    enable-openid-connect: true
    container: python:3.12-slim
    timeout-minutes: 5
    steps:
    - name: Checkout source job revision and current platform snapshot
      env:
        CHECKOUT_SHA: ${{ github.sha }}
      run: |
        set -eu
        apt-get update && apt-get install --no-install-recommends -y git ca-certificates
        git init source
        git -C source remote add origin https://git.cu3rd.ru/Jedi_kitten/cu-clubs-bot.git
        git -C source fetch --no-tags --depth 1 origin "$CHECKOUT_SHA"
        git -C source checkout --detach FETCH_HEAD
        git init platform
        git -C platform remote add origin https://git.cu3rd.ru/cu3rd/self-service.git
        git -C platform fetch --no-tags --depth 1 origin refs/heads/master
        git -C platform checkout --detach FETCH_HEAD
    - name: Install platform-pinned validation dependencies outside the checkouts
      run: |
        set -eu
        python -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: \
          --target "$RUNNER_TEMP/cu-clubs-delivery-python" -r platform/requirements.txt
    - name: Propose image tag while preserving reviewed sealed configuration
      env:
        DELIVERY_TOKEN: ${{ secrets.SELF_SERVICE_DELIVERY_TOKEN }}
        SOURCE_REPOSITORY: ${{ github.repository }}
        SOURCE_REF: ${{ github.ref }}
        SOURCE_EVENT: ${{ github.event_name }}
        SOURCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SOURCE_SHA: ${{ github.sha }}
        SELF_SERVICE_WORKER_ENABLED: ${{ vars.SELF_SERVICE_WORKER_ENABLED }}
      run: |
        set -eu
        export PYTHONPATH="$RUNNER_TEMP/cu-clubs-delivery-python"
        export PYTHONDONTWRITEBYTECODE=1
        python source/scripts/deliver_selfservice.py --root platform --source-root source
    defaults:
      run:
        shell: sh
