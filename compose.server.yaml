name: cu-clubs-test

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    CU_CLUBS_DATABASE_URL: postgresql+psycopg://cu_clubs:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cu_clubs
    CU_CLUBS_HOST: 0.0.0.0
    CU_CLUBS_BACKUP_DIRECTORY: /backups
    CU_CLUBS_GOOGLE_CREDENTIALS_PATH: /run/cu-clubs-secrets/google-user.json
  volumes:
    - google_credentials:/run/cu-clubs-secrets
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cu_clubs
      POSTGRES_DB: cu_clubs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cu_clubs -d cu_clubs"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: [cu-clubs, api]
    ports:
      - "127.0.0.1:8310:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: [cu-clubs, worker]
    volumes:
      - backups:/backups
      - google_credentials:/run/cu-clubs-secrets
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/cu-clubs-worker-heartbeat') < 240"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  database:
  backups:
  google_credentials:
